[project]
title = "My Economics Paper"
entrypoint = "scenes.py"
scene = "PaperExplainer"
output_file = "my_economics_paper"
theme = "midnight"

[render]
preview_width = 854
preview_height = 480
preview_fps = 15
width = 1920
height = 1080
fps = 30

[audio]
enabled = false
track = ""
license = ""
attribution = ""

[[qa.frame]]
time = 2.3
label = "opening question"
kind = "settled"

[[qa.frame]]
time = 4.7
label = "question to argument handoff"
kind = "transition"

[[qa.frame]]
time = 7.0
label = "persistent research argument"
kind = "settled"

[[qa.frame]]
time = 9.2
label = "argument to result handoff"
kind = "transition"

[[qa.frame]]
time = 11.5
label = "illustrative result"
kind = "settled"

[[qa.frame]]
time = 13.7
label = "result to interpretation handoff"
kind = "transition"

[[qa.frame]]
time = 15.5
label = "first interpretation term enters"
kind = "transition"

[[qa.frame]]
time = 16.5
label = "first interpretation term"
kind = "settled"

[[qa.frame]]
time = 17.2
label = "second interpretation term enters"
kind = "transition"

[[qa.frame]]
time = 18.5
label = "complete incremental interpretation"
kind = "settled"
