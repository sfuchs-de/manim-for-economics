[project]
name = "manim-for-economics"
version = "0.2.0"
description = "A beginner-friendly Manim starter for rigorous economics paper explainers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Simon Fuchs" }]
dependencies = [
  "manim==0.20.1",
]

[project.scripts]
econ-manim = "econ_manim.cli:main"

[dependency-groups]
dev = [
  "pyyaml>=6.0",
  "pytest>=8.3",
  "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/econ_manim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "media"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"starter/scenes.py" = ["E501"]
"examples/**/*.py" = ["E501"]
